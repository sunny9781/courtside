name: Apple TV screenshots

# Runs the Apple TV app in the simulator with sample data (-demo, no real login) and saves a picture of each
# screen, so layout changes can be checked without a TV. Runs on branches named tv-*.
on:
  push:
    branches: ["tv-*"]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Take screenshots
        run: scripts/tv-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-screens
          path: shots/
          retention-days: 3
