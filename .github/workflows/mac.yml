name: Mac app

# Every push to main builds the Mac app on GitHub's Macs and publishes it as a release of this repo, where the
# installed apps pick it up automatically. Nothing runs on Sunny's Mac.
on:
  push:
    branches: [main]
    # Not for Apple TV- or Android-only changes. A release always touches Shared/Changelog.swift, so that alone
    # doesn't count: an Android release (android/** + the changelog) no longer republishes an unchanged Mac app.
    paths-ignore: ["**.md", "CourtsideTV/**", "CourtsideTV-Info.plist", "scripts/tv-*.sh", "android/**",
                   "Shared/Changelog.swift", ".github/workflows/android.yml", ".github/workflows/check.yml"]
  workflow_dispatch:

concurrency:
  group: mac-build
  cancel-in-progress: true

permissions:
  contents: write   # publish releases on this repo

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # The downloaded Swift packages (VLCKit, KSPlayer/FFmpegKit...) are kept between runs (the same cache as the
      # Check workflow); they change only when Package.resolved does. Saves downloading them on every release.
      - name: Restore Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Courtside.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          # Without this the "| tail" below hid a failed build, and a half-built app (no program inside) was
          # published as 2.5: macOS said it was damaged.
          set -o pipefail
          # Build numbers start at 2 so a copy built in Xcode (build 1) is always "older".
          BUILD=$((BUILD_NUMBER + 1))
          # The version is the newest one in What's new (Shared/Changelog.swift), so they always match.
          VERSION=$(grep -o 'Release(version: "[0-9.]*"' Shared/Changelog.swift | head -1 | grep -o '[0-9][0-9.]*')
          VERSION=${VERSION:-1.0}
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild \
            -project Courtside.xcodeproj \
            -scheme Courtside \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            MARKETING_VERSION="$VERSION" \
            build | tail -n 40
          APP=build/Build/Products/Release/Courtside.app
          test -x "$APP/Contents/MacOS/Courtside"
          codesign --verify --deep "$APP"

      - name: Zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Courtside.app "$GITHUB_WORKSPACE/Courtside.zip"
          ls -lh "$GITHUB_WORKSPACE/Courtside.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Only while courtside-releases still exists: keeps copies installed before the move updating.
          LEGACY_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: scripts/publish-mac.sh Courtside.zip
