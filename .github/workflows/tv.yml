name: Apple TV app

# Builds the Apple TV app on Sunny's Mac, signs it with the free Apple account in Xcode, and installs it
# on the paired Apple TV. Free signing lasts 7 days, so this also runs every 3 days to keep it working.
on:
  push:
    branches: [main]
    paths: ["CourtsideTV/**", "Shared/**", "Courtside.xcodeproj/**", "CourtsideTV-Info.plist", ".github/workflows/tv.yml", "scripts/tv-*.sh"]
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, mid-morning Ottawa time
  workflow_dispatch:

concurrency:
  group: tv-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign and install on the Apple TV
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          TV_DEVICE: ${{ vars.TV_DEVICE }}
        run: scripts/tv-install.sh
