name: Android TV app

# Every push to main that touches android/ builds the Android TV app on GitHub's Linux machines (free for this
# public repo) and publishes it on the "android" release: Courtside.apk plus android.json, which installed apps
# check for updates. Other branches: run it by hand with "publish" off to just check that it builds.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/courtside.jks"
            echo "COURTSIDE_KEYSTORE=$RUNNER_TEMP/courtside.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret yet: this build is signed with a throwaway key and won't be published."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: What's new
        run: |
          mkdir -p android/app/src/main/assets
          python3 android/changelog.py Shared/Changelog.swift > android/app/src/main/assets/changelog.json

      - name: Build
        env:
          COURTSIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD=$(( ${{ github.run_number }} + 1 ))
          # The version is the newest one in What's new (Shared/Changelog.swift), like the Apple apps.
          VERSION=$(grep -o 'Release(version: "[0-9.]*"' Shared/Changelog.swift | head -1 | grep -o '[0-9][0-9.]*')
          VERSION=${VERSION:-1.0}
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gradle -p android assembleRelease -PbuildNumber="$BUILD" -PappVersion="$VERSION" --no-daemon --stacktrace 2>&1 | tee build.log | tail -60
          test -f android/app/build/outputs/apk/release/app-release.apk || { grep -E "^e: |error:" build.log | head -60; exit 1; }
          cp android/app/build/outputs/apk/release/app-release.apk Courtside.apk
          ls -lh Courtside.apk

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/android/Courtside.apk"
          printf '{\n  "build": %s,\n  "version": "%s",\n  "url": "%s"\n}\n' "$BUILD" "$VERSION" "$URL" > android.json
          # Never the "latest" release: that one is the Mac app's.
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "Android TV" --latest=false \
              --notes "Courtside for Android TV. Install with the Downloader app: $URL"
          gh release upload android Courtside.apk android.json --clobber
          echo "Published $VERSION (build $BUILD): $URL"
